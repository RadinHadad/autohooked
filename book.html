<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Consultation | AutoHooked</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    .booking-wrapper {
      padding: 30px 24px;
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .booking-panel {
      max-width: 930px;
      width: 100%;
      padding: 36px 42px;
    }
    .section-heading {
      font-size: 2.6rem;
      margin-bottom: 6px;
    }
    .hero-text {
      font-size: 1.3rem;
      margin-bottom: 24px;
      color: #94a3b8;
    }
    .clean-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
    }
    .form-group label {
      font-size: 1.14rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background-color: #0b0f19 !important;
      color: #f8fafc !important;
      border: 1px solid #1e293b !important;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1.3rem;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input[type="date"] {
      color-scheme: dark;
      cursor: pointer;
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #475569;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .input-error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
    }
    .checkbox-inline-group {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      padding: 6px 0;
    }
    .checkbox-item {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1.23rem;
      color: #cbd5e1;
      cursor: pointer;
      text-transform: none;
    }
    .checkbox-item input {
      accent-color: #0284c7;
      width: 22px;
      height: 22px;
      margin: 0;
      cursor: pointer;
    }
    .submit-btn {
      margin-top: 10px;
      padding: 15px 24px;
      font-size: 1.4rem;
      border-radius: 12px;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-msg {
      display: none;
      text-align: center;
      font-size: 1.15rem;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      line-height: 1.5;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .booking-panel {
        padding: 24px 18px;
      }
      .nav-items {
        display: flex !important;
      }
    }
  </style>
</head>
<body class="centered-layout">
  <div class="grid-bg">
    <div class="gradient-glow top-glow"></div>
  </div>

  <nav class="top-nav">
    <div class="nav-wrap">
      <a href="index.html" class="brand-logo">
        <span>Auto<span class="rainbow-text">Hooked</span></span>
      </a>
      <div class="nav-items">
        <a href="index.html" class="nav-link">Return Home</a>
      </div>
    </div>
  </nav>

  <main class="booking-wrapper">
    <div class="booking-panel glowing-box zoom-in">
      <h1 class="section-heading gradient-text-dynamic text-center bounce-element">Book A Meeting</h1>
      <p class="hero-text text-center slide-in-element">Select a convenient time below to discuss how we can help your business.</p>
      
      <form id="bookingForm" class="clean-form" novalidate>
        <div class="form-row">
          <div class="form-group slide-in-right-1">
            <label>Full Name *</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Full Name" class="input-focus-anim">
          </div>
          <div class="form-group slide-in-right-1">
            <label>Mobile Phone *</label>
            <input type="tel" id="phone" name="phone" required placeholder="0400 000 000" class="input-focus-anim">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group slide-in-right-2">
            <label>Personal Email *</label>
            <input type="email" id="email" name="email" required placeholder="name@gmail.com" class="input-focus-anim">
          </div>
          <div class="form-group slide-in-right-2">
            <label>Work Email (optional)</label>
            <input type="email" id="workEmail" name="workEmail" placeholder="name@company.com" class="input-focus-anim">
          </div>
        </div>

        <div class="form-group slide-in-right-2">
          <label>Services Interested In (optional)</label>
          <div class="checkbox-inline-group">
            <label class="checkbox-item">
              <input type="checkbox" name="services" value="Phone Assistant">
              Phone Assistant
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="services" value="ChatBot">
              ChatBot
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="services" value="Social Media Assistant">
              Social Media Assistant
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group slide-in-right-3">
            <label>Meeting Date *</label>
            <input type="date" id="meetingDate" name="meetingDate" required class="input-focus-anim" onclick="this.showPicker && this.showPicker()">
          </div>
          <div class="form-group slide-in-right-3">
            <label>Meeting Time *</label>
            <select id="meetingTime" name="meetingTime" required class="time-dropdown input-focus-anim">
              <option value="" disabled selected>Select an interval</option>
              <option value="10:00 AM">10:00 AM</option>
              <option value="10:30 AM">10:30 AM</option>
              <option value="11:00 AM">11:00 AM</option>
              <option value="11:30 AM">11:30 AM</option>
              <option value="12:00 PM">12:00 PM</option>
              <option value="12:30 PM">12:30 PM</option>
              <option value="1:00 PM">1:00 PM</option>
              <option value="1:30 PM">1:30 PM</option>
              <option value="2:00 PM">2:00 PM</option>
              <option value="2:30 PM">2:30 PM</option>
              <option value="3:00 PM">3:00 PM</option>
              <option value="3:30 PM">3:30 PM</option>
              <option value="4:00 PM">4:00 PM</option>
              <option value="4:30 PM">4:30 PM</option>
              <option value="5:00 PM">5:00 PM</option>
              <option value="5:30 PM">5:30 PM</option>
              <option value="6:00 PM">6:00 PM</option>
            </select>
          </div>
        </div>

        <div class="form-group slide-in-right-4">
          <label>Additional Notes (optional)</label>
          <textarea name="notes" rows="2" placeholder="Tell us about your current setup..." class="input-focus-anim" style="resize: none;"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn full-width pulse-button">Confirm Availability</button>
        <div id="statusMessage" class="status-msg"></div>
      </form>
    </div>
  </main>

  <footer class="main-footer">
    <div class="footer-wrap">
      <p>&copy; Copyright 2026 AutoHooked, Inc. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const CLOUDFLARE_WORKER_URL = 'https://verification.radin-hadad2k8.workers.dev';
    const dateInput = document.getElementById('meetingDate');
    const timeSelect = document.getElementById('meetingTime');
    const form = document.getElementById('bookingForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const yyyy = tomorrow.getFullYear();
    const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
    const dd = String(tomorrow.getDate()).padStart(2, '0');
    dateInput.min = `${yyyy}-${mm}-${dd}`;

    const inputsToValidate = ['phone', 'email', 'workEmail'];
    inputsToValidate.forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        this.classList.remove('input-error');
      });
    });

    dateInput.addEventListener('change', async () => {
      const selectedDate = dateInput.value;
      if (!selectedDate) return;

      const originalOptions = Array.from(timeSelect.options);
      timeSelect.disabled = true;

      try {
        const res = await fetch(`https://autohooked.app.n8n.cloud/webhook/consultation-availability?date=${selectedDate}`);
        if (res.ok) {
          const data = await res.json();
          const booked = new Set(data.bookedTimes || []);

          originalOptions.forEach(option => {
            if (!option.value) return;
            const isBooked = booked.has(option.value);
            option.disabled = isBooked;
            option.textContent = isBooked ? `${option.value} (Unavailable)` : option.value;
          });

          if (timeSelect.selectedOptions[0]?.disabled) {
            timeSelect.value = '';
          }
        }
      } catch (err) {
        console.warn('Availability check failed, keeping slots enabled:', err);
      } finally {
        timeSelect.disabled = false;
      }
    });

    function isValidPhone(phone) {
      const phoneRegex = /^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$/;
      return phoneRegex.test(phone.replace(/[\s-]/g, ''));
    }

    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phoneInput = document.getElementById('phone');
      const emailInput = document.getElementById('email');
      const workEmailInput = document.getElementById('workEmail');
      let hasError = false;
      let errorMsg = '';

      if (!isValidPhone(phoneInput.value)) {
        phoneInput.classList.add('input-error');
        errorMsg = 'Please enter a valid phone number.';
        hasError = true;
      }

      if (!isValidEmail(emailInput.value)) {
        emailInput.classList.add('input-error');
        errorMsg = errorMsg || 'Please enter a valid personal email address.';
        hasError = true;
      }

      if (workEmailInput.value.trim() !== '' && !isValidEmail(workEmailInput.value)) {
        workEmailInput.classList.add('input-error');
        errorMsg = errorMsg || 'Please enter a valid work email address.';
        hasError = true;
      }

      if (!form.fullName.value || !form.meetingDate.value || !form.meetingTime.value) {
        errorMsg = errorMsg || 'Please fill in all required fields.';
        hasError = true;
      }

      if (hasError) {
        statusMsg.className = 'status-msg status-error';
        statusMsg.textContent = errorMsg;
        statusMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending verification code...';
      statusMsg.style.display = 'none';

      try {
        const sendRes = await fetch(`${CLOUDFLARE_WORKER_URL}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phoneInput.value })
        });

        if (sendRes.status === 403) {
          throw new Error('blocked');
        }

        if (!sendRes.ok) {
          throw new Error('invalid_phone');
        }

        let verified = false;
        for (let attempt = 1; attempt <= 2; attempt++) {
          const promptMsg = attempt === 1 
            ? `Please enter the 6 digit verification code sent to ${phoneInput.value}:` 
            : `Incorrect code. You have 1 attempt remaining. Please re-enter the 6 digit code:`;

          const enteredCode = window.prompt(promptMsg);
          if (!enteredCode) {
            throw new Error('cancelled');
          }

          submitBtn.textContent = 'Verifying code...';

          const verifyRes = await fetch(`${CLOUDFLARE_WORKER_URL}/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phoneInput.value, code: enteredCode })
          });

          if (verifyRes.ok) {
            verified = true;
            break;
          }

          if (verifyRes.status === 403) {
            throw new Error('blocked');
          }
        }

        if (!verified) {
          throw new Error('blocked');
        }

        submitBtn.textContent = 'Securing booking...';

        const selectedServices = Array.from(
          document.querySelectorAll('input[name="services"]:checked')
        ).map(el => el.value).join(', ');

        const payload = {
          fullName: form.fullName.value,
          email: form.email.value,
          workEmail: form.workEmail.value || '',
          phone: form.phone.value,
          services: selectedServices || 'None selected',
          meetingDate: form.meetingDate.value,
          meetingTime: form.meetingTime.value,
          notes: form.notes.value || 'None provided'
        };

        const response = await fetch('https://autohooked.app.n8n.cloud/webhook/book-consultation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const resData = await response.json().catch(() => ({}));

        if (response.status === 409) {
          statusMsg.className = 'status-msg status-error';
          statusMsg.textContent = resData.message || 'It looks like you already have a consultation booked with this email or phone number.';
          statusMsg.style.display = 'block';
        } else if (response.ok) {
          statusMsg.className = 'status-msg status-success';
          statusMsg.textContent = 'Booking confirmed! Check your email for full details.';
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          throw new Error('Booking failed');
        }
      } catch (err) {
        statusMsg.className = 'status-msg status-error';
        if (err.message === 'blocked') {
          statusMsg.textContent = 'This phone number has been blocked due to multiple failed verification attempts. Please contact support.';
        } else if (err.message === 'invalid_phone') {
          statusMsg.textContent = 'This phone number is not valid or cannot receive messages. Please try again.';
        } else if (err.message === 'cancelled') {
          statusMsg.textContent = 'Verification cancelled. Please submit the form again to receive a new code.';
        } else {
          statusMsg.textContent = 'Something went wrong while securing your slot. Please try again or reach out directly.';
        }
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm Availability';
      }
    });
  </script>
</body>
</html>
